  - document_type: hotel_invoice
    drive_folder_id: "${HOTEL_INVOICES}"
    file_types: [pdf, jpg, jpeg, png, heic]

    extraction_prompt: |
      Extract hotel invoice details from GST Tax Invoice.
      Extract guest name, source, arrival time (date only), departure time (date only),
      booking ID, booking date, taxable amount, CGST, SGST, grand total,
      and invoice number from the GST Tax Invoice section.

    fields:
      - name: guest_name
        type: string
        required: true
      - name: source
        type: string
        required: true
      - name: arrival_time
        type: date
        required: true
      - name: departure_time
        type: date
        required: true
      - name: booking_id
        type: string
        required: true
      - name: booking_date
        type: date
        required: true
      - name: taxable_amount
        type: number
        required: true
      - name: cgst
        type: number
        required: true
      - name: sgst
        type: number
        required: true
      - name: grand_total
        type: number
        required: true
      - name: invoice_number
        type: string
        required: true
